<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AETHER FINANCIE SYSTEM</title>

  <!-- Load Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #cosmos {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }
    .overlay-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .modal-content {
      background: #1e1e30;
      border: 1px solid #00f3ff;
      border-radius: 16px;
      padding: 25px;
      max-width: 90%;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }
    .modal-title {
      font-family: 'Orbitron', sans-serif;
      color: #00f3ff;
      font-size: 1.3rem;
      margin-bottom: 15px;
    }
    .modal-text {
      color: #aaa;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn-ok {
      color: #00f3ff;
      text-decoration: underline;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .wallet-list {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #ffd700;
    }
  </style>
</head>
<body>

  <!-- 3D Cosmos Background -->
  <div id="cosmos"></div>

  <!-- Persistent Wallet Alert -->
  <div class="overlay-modal" id="wallet-alert">
    <div class="modal-content">
      <div class="modal-title">AETHER FINANCIE SYSTEM</div>
      <div class="modal-text">
        Na web-lokaciji aether-financie-system.onrender.com navodi se sljedeće<br>
        <span style="font-size:0.9rem;color:#ccc">No Web3 wallet detected. Please install 'MetaMask' or 'Trust Wallet' from the App Store to use this site.</span>
      </div>
      <div class="wallet-list" id="wallet-instructions">
        Scanning for wallets...
      </div>
      <div class="btn-ok" onclick="acknowledgeAlert()">U redu</div>
    </div>
  </div>

  <script>
    // 🔧 CONFIG: Replace with your deployed URL
    const YOUR_DAPP_URL = "https://your-github.io/your-repo"; // ⚠️ CHANGE THIS

    // Universal Wallet Deep Links
    const WALLET_LINKS = [
      // EVM Wallets
      { name: "MetaMask", ios: `https://metamask.app.link/dapp/${encodeURIComponent(YOUR_DAPP_URL)}`, android: `https://metamask.app.link/dapp/${encodeURIComponent(YOUR_DAPP_URL)}` },
      { name: "Trust Wallet", ios: `https://link.trustwallet.com/open_url?coin_id=60&url=${encodeURIComponent(YOUR_DAPP_URL)}`, android: `https://link.trustwallet.com/open_url?coin_id=60&url=${encodeURIComponent(YOUR_DAPP_URL)}` },
      { name: "Coinbase Wallet", ios: `https://go.cb-w.com/dapp?d=${encodeURIComponent(YOUR_DAPP_URL)}`, android: `https://go.cb-w.com/dapp?d=${encodeURIComponent(YOUR_DAPP_URL)}` },
      { name: "TokenPocket", ios: `https://tokenpocket.us/dapp?dapp_url=${encodeURIComponent(YOUR_DAPP_URL)}`, android: `https://tokenpocket.us/dapp?dapp_url=${encodeURIComponent(YOUR_DAPP_URL)}` },
      { name: "BitKeep", ios: `https://bkcode.vip/richscan?link=${encodeURIComponent(YOUR_DAPP_URL)}`, android: `https://bkcode.vip/richscan?link=${encodeURIComponent(YOUR_DAPP_URL)}` },
      { name: "OKX Wallet", ios: "https://www.okx.com/download", android: "https://www.okx.com/download" },
      { name: "Rabby", url: "https://rabby.io" },
      { name: "OneKey", ios: `https://link.onekey.so/dapp?dappUrl=${encodeURIComponent(YOUR_DAPP_URL)}`, android: `https://link.onekey.so/dapp?dappUrl=${encodeURIComponent(YOUR_DAPP_URL)}` },
      // Solana Wallets
      { name: "Phantom", ios: `https://phantom.app/ul/browse/${encodeURIComponent(YOUR_DAPP_URL)}`, android: `https://phantom.app/ul/browse/${encodeURIComponent(YOUR_DAPP_URL)}` },
      { name: "Backpack", ios: `https://backpack.app/ul/browse/${encodeURIComponent(YOUR_DAPP_URL)}`, android: `https://backpack.app/ul/browse/${encodeURIComponent(YOUR_DAPP_URL)}` }
    ];

    let currentWalletIndex = 0;
    let isConnecting = true;
    let platform = 'desktop';

    // Detect Platform
    function detectPlatform() {
      const ua = navigator.userAgent;
      if (/iPad|iPhone|iPod/.test(ua)) return 'ios';
      if (/Android/.test(ua)) return 'android';
      return 'desktop';
    }

    // Launch Wallet (Mobile Only)
    function launchWallet() {
      if (platform === 'desktop') return;

      const wallet = WALLET_LINKS[currentWalletIndex % WALLET_LINKS.length];
      const link = platform === 'ios' ? wallet.ios || wallet.url : wallet.android || wallet.url;

      if (!link) return;

      // Update UI
      document.getElementById('wallet-instructions').innerHTML = `Launching <b>${wallet.name}</b>...`;

      // Open deep link
      window.location.href = link;

      // Rotate to next wallet
      currentWalletIndex++;
    }

    // Check for Injected Wallets (Desktop & Mobile)
    async function detectAndConnectWallet() {
      // Wait for providers to load
      await new Promise(r => setTimeout(r, 500));

      // EVM: MetaMask, Rabby, Coinbase, OKX, etc.
      if (window.ethereum) {
        try {
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          if (accounts.length > 0) {
            triggerSuccess(`Connected: ${accounts[0].slice(0, 6)}...${accounts[0].slice(-4)}`);
            return true;
          }
        } catch (err) {
          console.warn("EVM connect failed", err);
        }
      }

      // Solana: Phantom, Backpack
      if (window.solana && window.solana.isPhantom) {
        try {
          const resp = await window.solana.connect({ onlyIfTrusted: false });
          if (resp.publicKey) {
            triggerSuccess(`Solana: ${resp.publicKey.toString().slice(0, 6)}...`);
            return true;
          }
        } catch (err) {
          console.warn("Solana connect failed", err);
        }
      }

      return false;
    }

    // Success Handler
    function triggerSuccess(msg) {
      document.getElementById('wallet-instructions').innerText = msg;
      document.querySelector('.modal-title').innerText = "ACCESS GRANTED";
      document.querySelector('.modal-title').style.color = "#ffd700";
      setTimeout(() => {
        document.getElementById('wallet-alert').style.display = "none";
        isConnecting = false;
      }, 1500);
    }

    // "U redu" does nothing
    function acknowledgeAlert() {
      // No action — loop continues
    }

    // 3D Cosmos Engine
    function init3D() {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('cosmos').appendChild(renderer.domElement);

      // Purple wireframe globe
      const geometry = new THREE.DodecahedronGeometry(5, 0);
      const material = new THREE.MeshBasicMaterial({ color: 0xbc13fe, wireframe: true, transparent: true, opacity: 0.2 });
      const shape = new THREE.Mesh(geometry, material);
      scene.add(shape);

      // Teal starfield
      const particles = new THREE.BufferGeometry();
      const positions = new Float32Array(500 * 3);
      for (let i = 0; i < 500 * 3; i++) positions[i] = (Math.random() - 0.5) * 20;
      particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const particleMat = new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.1 });
      const particleSystem = new THREE.Points(particles, particleMat);
      scene.add(particleSystem);

      camera.position.z = 10;

      function animate() {
        requestAnimationFrame(animate);
        shape.rotation.x += 0.005;
        shape.rotation.y += 0.005;
        particleSystem.rotation.y -= 0.002;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // Main Detection Loop
    async function startWalletEngine() {
      platform = detectPlatform();

      while (isConnecting) {
        const connected = await detectAndConnectWallet();
        if (connected) break;

        // Launch next wallet every 2.5s
        if (platform === 'ios' || platform === 'android') {
          launchWallet();
        } else {
          document.getElementById('wallet-instructions').innerHTML = "Detecting desktop wallets...<br><small>Open MetaMask, Phantom, or Rabby</small>";
        }

        await new Promise(r => setTimeout(r, 2500));
      }
    }

    // On Load
    window.onload = () => {
      init3D();
      startWalletEngine();
    };

    // Nuclear Fallback: Redirect to MetaMask after 20s
    setTimeout(() => {
      if (isConnecting) {
        const fallback = `https://metamask.app.link/dapp/${encodeURIComponent(YOUR_DAPP_URL)}`;
        window.location.href = fallback;
      }
    }, 20000);
  </script>
</body>
</html>
