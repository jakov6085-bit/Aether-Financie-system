<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Z-DIMENSION | ULTIMATE PROTOCOL</title>
 
 <!-- Three.js & Controls -->
 <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
 
 <!-- Fonts -->
 <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

 <style>
:root {
 --neon-cyan: #00f3ff;
 --neon-purple: #bc13fe;
 --neon-gold: #ffd700;
 --glass-bg: rgba(10, 15, 30, 0.85);
 --glass-border: rgba(0, 243, 255, 0.3);
 --text-main: #ffffff;
 --text-muted: #a0a0ff;
 }

 * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

 body {
 font-family: 'Rajdhani', sans-serif;
 background-color: #000;
 color: var(--text-main);
 overflow: hidden; 
 height: 100vh;
 width: 100vw;
 }

 /* --- 3D BACKGROUND --- */
 #cosmos-canvas {
 position: fixed;
 top: 0; left: 0;
 width: 100%; height: 100%;
 z-index: 0;
 }

 /* --- UI LAYER --- */
 #ui-layer {
 position: relative;
 z-index: 10;
 height: 100vh;
 display: flex;
 flex-direction: column;
 pointer-events: none;
 }

 /* Header */
 header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: 15px 20px;
 pointer-events: auto;
 background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
 }

.brand {
 font-family: 'Orbitron', sans-serif;
 font-size: 1.5rem;
 font-weight: 900;
 letter-spacing: 3px;
 background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
 -webkit-background-clip: text;
 -webkit-text-fill-color: transparent;
 cursor: pointer;
 text-shadow: 0 0 20px rgba(188, 19, 254, 0.5);
 }

.connect-btn {
 background: var(--neon-purple);
 color: white;
 border: none;
 padding: 10px 20px;
 font-family: 'Orbitron', sans-serif;
 font-size: 0.8rem;
 cursor: pointer;
 clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
 transition: 0.3s;
 box-shadow: 0 0 15px var(--neon-purple);
 }
.connect-btn:hover { box-shadow: 0 0 25px var(--neon-purple); transform: scale(1.05); }

 /* Main Content */
 main {
 flex: 1;
 position: relative;
 overflow-y: auto;
 overflow-x: hidden;
 padding: 20px;
 pointer-events: auto;
 scrollbar-width: thin;
 scrollbar-color: var(--neon-purple) #000;
 }

 /* Sections */
 section {
 display: none;
 max-width: 1200px;
 margin: 0 auto;
 animation: fadeIn 0.8s ease-out;
 }
 section.active { display: block; }

 @keyframes fadeIn {
 from { opacity: 0; transform: translateY(20px); }
 to { opacity: 1; transform: translateY(0); }
 }

 /* Home Hero */
.hero {
 height: 70vh;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 text-align: center;
 }

.hero h1 {
 font-family: 'Orbitron', sans-serif;
 font-size: 3.5rem;
 line-height: 1.1;
 margin-bottom: 20px;
 text-shadow: 0 0 30px var(--neon-purple);
 }

.hero p {
 font-size: 1.2rem;
 max-width: 600px;
 margin-bottom: 40px;
 color: var(--text-muted);
 }

 /* Packages */
.grid-container {
 display: grid;
 grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
 gap: 20px;
 margin-top: 40px;
 }

.card {
 background: var(--glass-bg);
 border: 1px solid var(--glass-border);
 padding: 20px;
 position: relative;
 transition: 0.4s;
 cursor: pointer;
 }

.card h3 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); margin-bottom: 5px; }
.card.roi { color: var(--neon-gold); font-size: 1.2rem; margin-bottom: 15px; font-weight: 700; }
.card.desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
.card-action { 
 width: 100%; padding: 10px; border: 1px solid var(--neon-purple); 
 color: var(--neon-purple); text-align: center; font-weight: 600; cursor: pointer; 
 }
.card:hover { transform: translateY(-5px); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,243,255,0.2); }

 /* Wallet Panel */
.wallet-panel {
 background: var(--glass-bg);
 border: 1px solid var(--glass-border);
 padding: 30px;
 backdrop-filter: blur(10px);
 max-width: 600px;
 margin: 0 auto;
 }

.wallet-tabs {
 display: flex;
 gap: 10px;
 margin-bottom: 20px;
 overflow-x: auto;
 padding-bottom: 10px;
 }

.tab {
 background: rgba(255,255,255,0.05);
 border: 1px solid rgba(255,255,255,0.2);
 color: var(--text-muted);
 padding: 10px 20px;
 cursor: pointer;
 white-space: nowrap;
 font-family: 'Orbitron', sans-serif;
 }

.tab.active {
 background: var(--neon-cyan);
 color: #000;
 box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
 }

.address-box {
 background: #000;
 padding: 15px;
 font-family: monospace;
 border-radius: 5px;
 word-break: break-all;
 margin-bottom: 20px;
 border: 1px solid var(--glass-border);
 color: var(--neon-gold);
 }

.btn-pay {
 width: 100%;
 padding: 20px;
 background: linear-gradient(90deg, #00f3ff, #0066ff);
 border: none;
 color: #000;
 font-weight: 800;
 font-family: 'Orbitron', sans-serif;
 cursor: pointer;
 margin-top: 10px;
 box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
 font-size: 1.2rem;
 }

 /* Overlay */
.overlay {
 position: fixed;
 top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(0,0,0,0.95);
 z-index: 100;
 display: none;
 justify-content: center;
 align-items: center;
 flex-direction: column;
 }
.overlay.active { display: flex; }

.hash {
 font-family: monospace;
 color: var(--neon-cyan);
 font-size: 1.1rem;
 margin: 20px 0;
 word-break: break-all;
 max-width: 90%;
 }
.timer {
 font-size: 2rem;
 color: var(--neon-gold);
 font-family: 'Orbitron';
 margin-top: 20px;
 }

.install-btn {
 background: var(--neon-gold);
 color: #000;
 border: none;
 padding: 15px 30px;
 font-weight: bold;
 font-family: 'Orbitron';
 cursor: pointer;
 margin-top: 20px;
 }

 /* Mobile Adjustments */
 @media (max-width: 768px) {
.hero h1 { font-size: 2.5rem; }
 }
 </style>
</head>
<body>

 <!-- 3D Background -->
 <div id="cosmos-canvas"></div>

 <!-- UI Overlay -->
 <div id="ui-layer">
 <header>
 <div class="brand" onclick="goToHome()">Z-DIMENSION</div>
 <button class="connect-btn" id="connect-wallet-btn" onclick="connectWallet()">CONNECT WALLET</button>
 </header>

 <main>
 <!-- HOME SECTION -->
 <section id="home" class="active">
 <div class="hero">
 <h1>MAXIMIZE<br>YOUR ASSETS</h1>
 <p>Connect your wallet. Select a package. Automatic monthly payouts.</p>
 <button class="cta-btn" onclick="navigate('packages')" style="padding: 15px 40px;">START EARNING</button>
 </div>
 </section>

 <!-- PACKAGES SECTION -->
 <section id="packages">
 <h2 style="font-family: 'Orbitron'; text-align: center; margin-bottom: 20px;">SELECT YOUR TRAVEL VEHICLE</h2>
 <div class="grid-container" id="package-grid">
 <!-- Cards injected via JS -->
 </div>
 </section>

 <!-- WALLET SECTION -->
 <section id="wallet">
 <div class="wallet-panel">
 <h2 style="font-family: 'Orbitron'; margin-bottom: 15px;">PAYMENT GATEWAY</h2>
 <p id="payment-details" style="color: white; margin-bottom: 20px; font-weight: bold; text-align: center;"></p>
 
 <div class="wallet-tabs">
 <button class="tab active" onclick="switchNetwork('eth')">ETH</button>
 <button class="tab" onclick="switchNetwork('bsc')">BSC</button>
 <button class="tab" onclick="switchNetwork('btc')">BTC</button>
 <button class="tab" onclick="switchNetwork('bch')">BCH</button>
 </div>

 <div class="address-box" id="wallet-address-display">
 <!-- Address loads here -->
 </div>

 <button class="btn-pay" onclick="initiatePayment()">PAY & ACTIVATE</button>
 
 <button class="cta-btn" style="width: 100%; margin-top: 10px; background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan);" onclick="navigate('home')">BACK TO HOME</button>
 </div>
 </section>
 </main>
 </div>

 <!-- Success Overlay -->
 <div class="overlay" id="success-overlay">
 <h2 style="font-family: 'Orbitron'; color: var(--neon-cyan); font-size: 2rem;">PAYMENT CONFIRMED</h2>
 <p>Your 30-day cycle has started.</p>
 <div class="hash" id="tx-hash">Generating Hash...</div>
 <div class="timer">Next Cycle: 30 Days</div>
 <button class="cta-btn" style="padding: 10px 30px; margin-top: 20px;" onclick="closeOverlay()">DONE</button>
 </div>

 <script>
 // --- DATA: YOUR ADDRESSES ---
 const ADDRESSES = {
 eth: "0xf8cc5A87F35Bde1482f3A0Eeb211F7C92F5DB0b6",
 bsc: "0xf8cc5A87F35Bde1482f3A0Eeb211F7C92F5DB0b6",
 btc: "bc1qt4pw6tujqgv32cem25guhfsccg5x93yglj76d7",
 bch: "qpfpzqzjnq8nkvwafmarv4u9nkva23fnm5h0clf4zq"
 };

 // Generate packages from $10 to $500
 const generatePackages = () => {
 const grid = document.getElementById('package-grid');
 for (let i = 10; i <= 500; i += 10) {
 const roi = (1.2 + (Math.random() * 2)).toFixed(2); // Random ROI
 const card = document.createElement('div');
 card.className = 'card';
 card.onclick = () => selectPackage(i, roi);
 card.innerHTML = `
 <h3>Level ${i}</h3>
 <div class="roi">ROI: ${roi}x / 30 Days</div>
 <div class="desc">Price: $${i} | Auto-Activate</div>
 <div class="card-action">SELECT</div>
 `;
 grid.appendChild(card);
 }
 };

 let currentWalletType = 'eth';
 let currentAmount = 0;
 let currentRoi = 0;
 let isConnected = false;

 // --- 3D ENGINE ---
 function initCosmos() {
 const canvas = document.getElementById('cosmos-canvas');
 const scene = new THREE.Scene();
 
 const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
 camera.position.z = 25;
 camera.position.y = 5;

 const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
 renderer.setSize(window.innerWidth, window.innerHeight);
 renderer.setPixelRatio(window.devicePixelRatio);
 canvas.appendChild(renderer.domElement);

 const controls = new THREE.OrbitControls(camera, renderer.domElement);
 controls.enableDamping = true;
 controls.autoRotate = true;
 controls.autoRotateSpeed = 0.8;

 const geometry = new THREE.IcosahedronGeometry(10, 2);
 const material = new THREE.MeshBasicMaterial({ color: 0xbc13fe, wireframe: true, transparent: true, opacity: 0.3 });
 const globe = new THREE.Mesh(geometry, material);
 scene.add(globe);

 const particlesGeometry = new THREE.BufferGeometry();
 const count = 2000;
 const posArray = new Float32Array(count * 3);
 for(let i = 0; i < count * 3; i++) posArray[i] = (Math.random() - 0.5) * 80;
 particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
 const particlesMaterial = new THREE.PointsMaterial({ size: 0.15, color: 0x00f3ff, transparent: true, opacity: 0.8 });
 const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
 scene.add(particlesMesh);

 function animate() {
 requestAnimationFrame(animate);
 globe.rotation.y += 0.002;
 particlesMesh.rotation.y -= 0.0005;
 controls.update();
 renderer.render(scene, camera);
 }
 animate();

 window.addEventListener('resize', () => {
 camera.aspect = window.innerWidth / window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth, window.innerHeight);
 });
 }

 // --- WALLET CONNECTION LOGIC (FIXED FOR MOBILE) ---
 async function connectWallet() {
 const btn = document.getElementById('connect-wallet-btn');

 if (window.ethereum) {
 try {
 // 1. Try standard connection
 const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
 
 if (accounts.length > 0) {
 btn.innerText = accounts[0].substring(0, 6) + '...';
 btn.style.background = '#00f3ff';
 btn.style.color = '#000';
 isConnected = true;
 openSuccess("Wallet Connected");
 }
 } catch (error) {
 console.error("Standard connection failed", error);
 // 2. Fallback: Force open wallet in new tab
 openWalletInNewTab();
 }
 } else {
 // No wallet found
 btn.innerText = "INSTALL WALLET";
 btn.style.background = "var(--neon-gold)";
 alert("No Web3 wallet detected. Please install 'MetaMask' or 'Trust Wallet' from the App Store to use this site.");
 }
 }

 function openWalletInNewTab() {
 // This forces the wallet app to open if the in-page popup is blocked
 window.open('https://metamask.app.link/dapp/' + window.location.href, '_blank');
 alert("If your wallet did not open automatically, please click OK to open it manually.");
 }

 // --- APP LOGIC ---

 function navigate(sectionId) {
 document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
 document.getElementById(sectionId).classList.add('active');
 }

 function goToHome() {
 navigate('home');
 }

 function selectPackage(amount, roi) {
 if (!isConnected) {
 alert("Please connect your wallet first.");
 navigate('home'); 
 return;
 }

 currentAmount = amount;
 currentRoi = roi;
 
 navigate('wallet');
 
 // Update Payment Details
 document.getElementById('payment-details').innerText = `You will pay $${amount} to activate this package.`;
 
 // Load Address
 updateAddressDisplay();
 }

 function switchNetwork(type) {
 currentWalletType = type;
 document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
 const tabs = document.querySelectorAll('.tab');
 if(type === 'eth') tabs[0].classList.add('active');
 if(type === 'bsc') tabs[1].classList.add('active');
 if(type === 'btc') tabs[2].classList.add('active');
 if(type === 'bch') tabs[3].classList.add('active');
 updateAddressDisplay();
 }

 function updateAddressDisplay() {
 const addressDisplay = document.getElementById('wallet-address-display');
 addressDisplay.innerText = ADDRESSES[currentWalletType];
 }

 // --- PAYMENT LOGIC ---
 function initiatePayment() {
 if (!isConnected) {
 alert("Wallet not connected. Please connect first.");
 return;
 }

 const overlay = document.getElementById('success-overlay');
 const hashDisplay = document.getElementById('tx-hash');
 
 overlay.classList.add('active');
 hashDisplay.innerText = "INITIALIZING TRANSACTION ON BLOCKCHAIN...";
 
 setTimeout(() => {
 const fakeHash = "0x" + Array(64).fill(0).map(() => Math.floor(Math.random() * 16).toString(16)).join('');
 hashDisplay.innerText = `Transaction Hash: ${fakeHash}`;
 }, 1000);

 setTimeout(() => {
 document.querySelector('#success-overlay h2').innerText = "PAYMENT CONFIRMED";
 document.querySelector('#success-overlay h2').style.color = "var(--neon-gold)";
 hashDisplay.innerText = `Sent to: ${ADDRESSES[currentWalletType]}`;
 }, 2500);
 }

 function openSuccess(msg) {
 const overlay = document.getElementById('success-overlay');
 document.querySelector('#success-overlay h2').innerText = msg;
 document.querySelector('#success-overlay h2').style.color = "var(--neon-cyan)";
 document.getElementById('tx-hash').innerText = "WAITING FOR BLOCK...";
 overlay.classList.add('active');
 }

 function closeOverlay() {
 document.getElementById('success-overlay').classList.remove('active');
 navigate('home');
 }

 window.onload = () => {
 initCosmos();
 generatePackages();
 };

 </script>
</body>
</html>
